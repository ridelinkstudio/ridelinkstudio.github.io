<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RideLink - Your Transport Business, Connected</title>

<meta name="description" content="RideLink helps drivers and businesses build a professional online presence and connect directly with customers.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#071a2b;
    color:white;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.container{
    width:100%;
    max-width:800px;
    padding:40px 25px;
}

.logo{
    font-size:42px;
    font-weight:bold;
    color:#20d6c7;
    margin-bottom:15px;
}

h1{
    font-size:2.4rem;
    margin-bottom:15px;
}

p{
    color:#d8e5e8;
    font-size:1.1rem;
    line-height:1.7;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    background:#20d6c7;
    color:#071a2b;
    text-decoration:none;
    font-weight:bold;
    padding:15px 30px;
    border-radius:30px;
    margin:8px;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.secondary{
    background:transparent;
    color:#20d6c7;
    border:1px solid #20d6c7;
}

footer{
    margin-top:45px;
    color:#8fa5ad;
    font-size:0.9rem;
}

footer a{
    color:#20d6c7;
    text-decoration:none;
}

@media(max-width:600px){
    h1{
        font-size:1.9rem;
    }

    .logo{
        font-size:34px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">RideLink</div>

    <h1>Your Business, Connected.</h1>

    <p>
        RideLink helps drivers, entrepreneurs, and small businesses
        build a professional online presence and connect directly
        with customers.
    </p>

    <a href="https://ridelinkstudio.github.io/ridelink/" class="btn">
        Explore RideLink
    </a>

    <a href="https://ridelinkstudio.github.io/business/" class="btn">
        RideLink business
    </a>
    
    <a href="https://ridelinkstudio.github.io/ridelink/about.html" class="btn secondary">
        About RideLink
    </a>

    <footer>
        <p>
            &copy; 2026 RideLink.
            <a href="https://ridelinkstudio.github.io/ridelink/privacy.html">
                Privacy Policy
            </a>
            |
            <a href="https://ridelinkstudio.github.io/ridelink/contact.html">
                Contact
            </a>
        </p>
    </footer>

</div>

</body>
</html>
